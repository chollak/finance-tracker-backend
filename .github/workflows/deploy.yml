name: Deploy to Production

# Деплой законсервирован 2026-08-13 (FT-047).
#
# Прод-сервер выведен из планов, работа идёт локально. До этого джоб `deploy`
# падал на каждый пуш с `dial tcp ***:22: i/o timeout` — 84 провала подряд
# начиная с 2026-01-27, последнего успешного деплоя. Красный значок перестал
# что-либо означать, а каждый пуш присылал письмо о провале.
#
# Что сделано: `quality-gate` продолжает работать на каждый пуш — это
# единственная работающая CI-проверка, и она не зависит от сервера. Джоб
# `deploy` теперь запускается только вручную через workflow_dispatch.
#
# Чтобы вернуть автодеплой: поднять хост, сверить секреты SSH_HOST / SSH_USER /
# SSH_KEY с реальным адресом, прогнать вручную через "Run workflow" и убедиться
# в зелёном прогоне, затем убрать условие `if` у джоба `deploy`.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run full verification
      run: npm run verify

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    # Только ручной запуск, пока прод-хост не вернётся. См. комментарий вверху файла.
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Deploy over SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        timeout: 120s
        command_timeout: 20m
        script: |
          echo "🚀 Starting deployment..."

          # Navigate to project directory
          cd $HOME/finance-tracker-backend || {
            echo "❌ Project directory not found. Cloning repository..."
            git clone https://github.com/${{ github.repository }} $HOME/finance-tracker-backend
            cd $HOME/finance-tracker-backend
          }

          # Pull latest changes
          echo "📥 Pulling latest changes..."
          git pull origin main

          # Stop existing containers (with timeout and force)
          echo "🛑 Stopping existing containers..."
          docker compose down --timeout 30 || docker compose kill || true

          # Clean up any dangling containers
          docker container prune -f || true

          # Rebuild and start containers
          echo "🔨 Building and starting containers..."
          docker compose up -d --build --force-recreate

          # Wait for services to be ready
          echo "⏳ Waiting for services to start..."
          sleep 15

          # Check if containers are running
          echo "🔍 Checking container status..."
          docker compose ps

          # Show recent logs
          echo "📋 Recent logs:"
          docker compose logs --tail=20

          echo "✅ Deployment complete!"
