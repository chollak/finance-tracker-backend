name: Verify

# Каждый PR проверяется тем же, что `npm run verify` локально (шаги — в package.json): сборка
# backend, типы тестов (typecheck:tests) и скриптов (typecheck:scripts), ESLint webapp, Jest,
# Vitest, сборка webapp, шрифты, токены, архитектура. Заменил автоматическое ревью
# claude-code-review.yml (2026-10-21): ревью делали агенты и Hermes, теперь — под-чат проверки,
# а тесты на PR не запускал никто. claude.yml (@claude в комментарии) убран 2026-11-03 (FT-050).

on:
  pull_request:
  workflow_dispatch:

# Новый push в тот же PR отменяет прогон, который ещё идёт
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json

      # postinstall ставит и собирает webapp
      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify
