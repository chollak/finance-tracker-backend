name: Задача
description: Описанная задача — Context и Definition of Done
body:
  - type: markdown
    attributes:
      value: |
        На доску [Kapelka](https://github.com/users/chollak/projects/1) задачу ставит владелец репозитория. Issue публичная: без токенов, ключей, содержимого `.env*`, адресов серверов и сумм из настоящих записей.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Что не так и почему это важно. Ссылки на файлы и строки. Для экрана — строка `Design: «Название доски»`."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Проверяемые пункты, а не намерения.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: touches
    attributes:
      label: Затрагивает
      description: "Файлы и папки; область (backend, webapp, ios, bot); миграция БД — да или нет. Нужно для Очереди, можно дописать потом."
  - type: textarea
    id: manual
    attributes:
      label: Руками после мержа
      description: "Что проверить самому после мержа (iPhone, Mini App в Telegram, голос, Apple Pay, ПК) или «ничего». Нужно для Очереди, можно дописать потом."
  - type: textarea
    id: notes
    attributes:
      label: Заметки
      description: Риски, что уже пробовали. Необязательно.
