<!doctype html>
<html>
<head>

  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; font-family: 'Onest', system-ui, -apple-system, sans-serif; }
    a { color: oklch(9.6% 0 0); } a:hover { color: oklch(40% 0 0); }
    .num { font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; min-height: 58px; padding: 0 18px; gap: 12px; }
    .k { font-size: 16px; letter-spacing: -0.01em; }
    .v { font-size: 16px; color: oklch(65% 0 0); letter-spacing: -0.01em; }

<div style="width: 390px; height: 844px; background: oklch(95% 0 0); color: oklch(9.6% 0 0); display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 52px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 18px; height: 52px; flex-shrink: 0;">
    <div style="min-width: 44px; height: 44px; display: flex; align-items: center; font-size: 16px; color: oklch(53.2% 0 0);">Отмена</div>

  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 0;">

      <div class="row">
        <div style="flex-grow: 1; display: flex; align-items: center;">
          <div style="width: 2px; height: 22px; background: oklch(9.6% 0 0); margin-right: 1px;"></div>
          <div class="v">Описание</div>
        </div>
      </div>
      <div class="hr"></div>
      <div class="row">
        <div class="k" style="flex-grow: 1;">Сумма</div>
        <div class="num v" style="font-weight: 500;">0</div>
        <div class="v" style="font-size: 14px;">сум</div>

      <div class="hr"></div>
      <div class="row">
        <div class="k" style="flex-grow: 1;">Категория</div>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(70% 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4"></path><path d="M16 15l-4 4-4-4"></path></svg>
      </div>

      <div class="row">
        <div class="k" style="flex-grow: 1;">Дата</div>
        <div style="padding: 7px 13px; border-radius: 9999px; background: oklch(93% 0 0); font-size: 15px; font-weight: 500;">28 авг 2026</div>
      </div>
    </div>

    <div style="font-size: 12.5px; line-height: 1.5; color: oklch(58% 0 0); padding: 0 6px;">
      Запасной путь, когда фразу разобрать не удалось. Обычный способ — написать одной строкой.

  </div>

</div>
