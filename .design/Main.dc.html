<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Onest', system-ui, -apple-system, sans-serif; }
    a { color: oklch(9.6% 0 0); } a:hover { color: oklch(40% 0 0); }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(96.5% 0 0); color: oklch(9.6% 0 0); display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- Пустота под системную шапку Telegram: своей строки состояния не рисуем -->
  <div style="height: 52px; flex-shrink: 0;"></div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 0 16px;">

    <!-- Сводка: белая карточка на сером -->
    <div style="background: oklch(100% 0 0); border-radius: 24px; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 18px;">

      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 13.5px; font-weight: 500; color: oklch(53.2% 0 0);">Потрачено в августе</div>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <div class="num" style="font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;">54 124 654</div>
          <div style="font-size: 15px; font-weight: 500; color: oklch(53.2% 0 0);">сум</div>
        </div>
      </div>

      <!-- График с сеткой и подписями оси. Для миллионов ось компактная: 5М вместо 5 000 000 -->
      <div style="display: flex; gap: 10px;">
        <div style="flex-grow: 1; position: relative; height: 92px;">
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;">
            <div style="height: 1px; background: oklch(92% 0 0);"></div>
            <div style="height: 1px; background: oklch(92% 0 0);"></div>
            <div style="height: 1px; background: oklch(92% 0 0);"></div>
            <div style="height: 1px; background: oklch(92% 0 0);"></div>
          </div>
          <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 9px; padding: 0 2px;">
            <div style="flex-grow: 1; height: 30%; background: oklch(9.6% 0 0); border-radius: 3px;"></div>
            <div style="flex-grow: 1; height: 55%; background: oklch(9.6% 0 0); border-radius: 3px;"></div>
            <div style="flex-grow: 1; height: 20%; background: oklch(9.6% 0 0); border-radius: 3px;"></div>
            <div style="flex-grow: 1; height: 79%; background: oklch(9.6% 0 0); border-radius: 3px;"></div>
            <div style="flex-grow: 1; height: 42%; background: oklch(9.6% 0 0); border-radius: 3px;"></div>
            <div style="flex-grow: 1; height: 8%; background: oklch(9.6% 0 0); border-radius: 3px;"></div>
            <div style="flex-grow: 1; height: 63%; background: oklch(9.6% 0 0); border-radius: 3px;"></div>
          </div>
        </div>
        <div class="num" style="width: 30px; flex-shrink: 0; height: 92px; display: flex; flex-direction: column; justify-content: space-between; font-size: 10.5px; color: oklch(64% 0 0); text-align: right;">
          <div style="transform: translateY(-5px);">6М</div>
          <div style="transform: translateY(-5px);">4М</div>
          <div style="transform: translateY(-5px);">2М</div>
          <div style="transform: translateY(-5px);">0</div>
        </div>
      </div>

      <div style="display: flex; gap: 9px; padding-right: 40px; font-size: 11px; font-weight: 500; color: oklch(64% 0 0);">
        <div style="flex-grow: 1; text-align: center;">Пн</div>
        <div style="flex-grow: 1; text-align: center;">Вт</div>
        <div style="flex-grow: 1; text-align: center;">Ср</div>
        <div style="flex-grow: 1; text-align: center;">Чт</div>
        <div style="flex-grow: 1; text-align: center;">Пт</div>
        <div style="flex-grow: 1; text-align: center;">Сб</div>
        <div style="flex-grow: 1; text-align: center;">Вс</div>
      </div>

    </div>

    <!-- Лента: заголовок дня обычным текстом снаружи, строки внутри белой карточки -->
    <div style="display: flex; flex-direction: column; gap: 16px;">

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="font-size: 14px; font-weight: 500; color: oklch(53.2% 0 0); padding-left: 4px;">Сегодня</div>
        <div style="background: oklch(100% 0 0); border-radius: 20px; padding: 4px 14px;">

          <div style="display: flex; align-items: center; gap: 12px; min-height: 56px;">
            <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: oklch(95.3% 0 0); display: flex; align-items: center; justify-content: center;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(9.6% 0 0)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>
            </div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
              <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">Кофе и завтрак</div>
              <div style="font-size: 12.5px; color: oklch(60% 0 0);">Кофе</div>
            </div>
            <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: -0.015em;">32 000</div>
          </div>

          <div style="height: 1px; background: oklch(93% 0 0); margin-left: 50px;"></div>

          <div style="display: flex; align-items: center; gap: 12px; min-height: 56px;">
            <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: oklch(95.3% 0 0); display: flex; align-items: center; justify-content: center;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(9.6% 0 0)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14"></path><path d="M6 17V9.5L7.8 5h8.4L18 9.5V17"></path><circle cx="8" cy="17" r="2"></circle><circle cx="16" cy="17" r="2"></circle><path d="M6 10h12"></path></svg>
            </div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
              <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">Яндекс такси</div>
              <div style="font-size: 12.5px; color: oklch(60% 0 0);">Такси</div>
            </div>
            <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: -0.015em;">25 000</div>
          </div>

        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="font-size: 14px; font-weight: 500; color: oklch(53.2% 0 0); padding-left: 4px;">Вчера</div>
        <div style="background: oklch(100% 0 0); border-radius: 20px; padding: 4px 14px;">

          <div style="display: flex; align-items: center; gap: 12px; min-height: 56px;">
            <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: oklch(95.3% 0 0); display: flex; align-items: center; justify-content: center;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(9.6% 0 0)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16l-1.4 11.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8Z"></path><path d="M9 6V4.5a3 3 0 0 1 6 0V6"></path></svg>
            </div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
              <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">Корзинка</div>
              <div style="font-size: 12.5px; color: oklch(60% 0 0);">Продукты</div>
            </div>
            <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: -0.015em;">450 000</div>
          </div>

          <div style="height: 1px; background: oklch(93% 0 0); margin-left: 50px;"></div>

          <!-- Не расход: в сумму сверху не входит, поэтому приглушён и подписан -->
          <div style="display: flex; align-items: center; gap: 12px; min-height: 56px;">
            <div style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: oklch(95.3% 0 0); display: flex; align-items: center; justify-content: center;">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(60% 0 0)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3"></path><path d="M17 17H6l3 3"></path></svg>
            </div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
              <div style="font-size: 15px; font-weight: 700; color: oklch(60% 0 0); letter-spacing: -0.01em;">Перевод на Alif</div>
              <div style="font-size: 12.5px; color: oklch(60% 0 0);">Не входит в расходы</div>
            </div>
            <div class="num" style="font-size: 15px; font-weight: 500; white-space: nowrap; color: oklch(60% 0 0); letter-spacing: -0.015em;">500 000</div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Кнопка добавления: чёрный круг, как у SyncSpend -->
  <div style="position: absolute; right: 22px; bottom: 30px; width: 58px; height: 58px; border-radius: 9999px; background: oklch(9.6% 0 0); display: flex; align-items: center; justify-content: center;">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="oklch(100% 0 0)" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </div>

</div>
</x-dc>
</body>
</html>
