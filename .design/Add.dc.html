<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Onest', system-ui, -apple-system, sans-serif; }
    a { color: oklch(9.6% 0 0); } a:hover { color: oklch(40% 0 0); }
    .num { font-variant-numeric: tabular-nums; }
    .sug { display: flex; align-items: center; gap: 11px; min-height: 52px; }
    .sico { width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: oklch(95.3% 0 0); display: flex; align-items: center; justify-content: center; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: oklch(96.5% 0 0); color: oklch(9.6% 0 0); overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; padding: 52px 16px 0;">
    <div style="background: oklch(100% 0 0); border-radius: 24px; padding: 20px 20px 16px;">
      <div style="font-size: 13.5px; color: oklch(53.2% 0 0); margin-bottom: 5px;">Потрачено в августе</div>
      <div class="num" style="font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;">54 124 654</div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: oklch(0% 0 0 / 0.38);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 52px; background: oklch(100% 0 0); border-radius: 26px 26px 0 0; padding: 12px 20px 18px; display: flex; flex-direction: column; gap: 14px;">

    <div style="width: 38px; height: 4px; border-radius: 9999px; background: oklch(88% 0 0); align-self: center;"></div>

    <!-- Поле остаётся одним. Форма не появилась -->

      <div style="font-size: 21px; font-weight: 500; letter-spacing: -0.015em; line-height: 1.35;">коф</div>
      <div style="width: 2px; height: 24px; background: oklch(9.6% 0 0);"></div>
    </div>

    <div style="height: 1px; background: oklch(93% 0 0); margin: 0 -20px;"></div>

    <!-- Память: подсказки из уже загруженной истории. Тап подставляет всю фразу целиком -->

      <div class="sug">
        <div class="sico">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(9.6% 0 0)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;"><span style="font-weight: 800;">Коф</span>е и завтрак</div>
          <div style="font-size: 12.5px; color: oklch(60% 0 0);">Кофе · 12 раз в этом месяце</div>
        </div>
        <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap;">32 000</div>
      </div>

      <div style="height: 1px; background: oklch(93% 0 0); margin-left: 45px;"></div>

      <div class="sug">
        <div class="sico">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(9.6% 0 0)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px;">
          <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;"><span style="font-weight: 800;">Коф</span>е</div>
          <div style="font-size: 12.5px; color: oklch(60% 0 0);">Кофе · вчера</div>
        </div>
        <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap;">25 000</div>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: oklch(9.6% 0 0); display: flex; align-items: center; justify-content: center;">
    <div style="font-size: 15.5px; font-weight: 600; color: oklch(100% 0 0); letter-spacing: 0.01em;">Записать</div>
  </div>

</div>
</x-dc>

</html>
