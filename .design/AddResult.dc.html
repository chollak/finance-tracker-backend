<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>

    .row { display: flex; align-items: center; gap: 12px; min-height: 56px; }
    .ico { width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: oklch(95.3% 0 0); display: flex; align-items: center; justify-content: center; }

</helmet>

<div style="width: 390px; height: 844px; background: oklch(96.5% 0 0); color: oklch(9.6% 0 0); display: flex; flex-direction: column; overflow: hidden; position: relative;">

    </div>

             Это и есть обратная связь: категорию показал сервер, а не догадка клиента -->

            <div style="font-size: 12.5px; color: oklch(53.2% 0 0);">Такси</div>
          </div>
          <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: -0.015em;">45 000</div>
        </div>

        <div class="row">
          <div class="ico">

            <div style="font-size: 12.5px; color: oklch(60% 0 0);">Кофе</div>
          </div>
          <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: -0.015em;">32 000</div>

        <div class="sep"></div>

          <div class="ico">

          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0;">
            <div style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em;">Яндекс такси</div>
            <div style="font-size: 12.5px; color: oklch(60% 0 0);">Такси</div>
          </div>
          <div class="num" style="font-size: 15px; font-weight: 700; white-space: nowrap; letter-spacing: -0.015em;">25 000</div>
        </div>

      </div>
    </div>

  </div>

  <div style="position: absolute; right: 22px; bottom: 30px; width: 58px; height: 58px; border-radius: 9999px; background: oklch(9.6% 0 0); display: flex; align-items: center; justify-content: center;">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="oklch(100% 0 0)" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </div>

</div>
</x-dc>
</body>
</html>
