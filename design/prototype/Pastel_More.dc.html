      sheetTitle: { summary: "Сводка дня", limits: "Цели и подписки", audit: "Звать на ревизию", theme: "Тема" }[s.sheet] || "",
      isTheme: s.sheet === "theme",
      themeOpts: opts.map((o, i) => ({ title: o[1], sub: o[2], on: s.theme === o[0], checked: s.theme === o[0] ? "true" : "false", ring: s.theme === o[0] ? "0" : "2px solid " + t.muted, fill: s.theme === o[0] ? t.primaryBg : "transparent", divider: i === 0 ? "none" : "1px solid " + t.line, pick: () => this.setState({ theme: o[0] }) })),
      isNotify: !!key,
      notifyText: { summary: "Вечером бот пришлёт, сколько потрачено за день и на что, — одним сообщением с кнопкой «Открыть Daftar».", limits: "Днём, если трата по цели из ревизии подходит к лимиту, и за день до списания подписки, которую вы решили отменить.", audit: "Раз в месяц бот позовёт разобрать траты прошлого месяца: что было нужно, а что лишнее." }[key] || "",
      hasNotifyNote: key === "summary",
      notifyNote: "В день без записей сводка спросит, правда ли трат не было, — отдельного напоминания нет.",
      switchLabel: { summary: "Присылать сводку", limits: "Предупреждать", audit: "Звать 1-го числа" }[key] || "",
      notifyOnStr: on ? "true" : "false",
      toggleNotify: () => setNotify({ on: !cur.on }),
      knobSide: on ? "flex-end" : "flex-start",
      trackBg: on ? t.primaryBg : "transparent",
      trackBorder: on ? "0" : "2px solid " + t.muted,
      knobBg: on ? t.primaryInk : t.muted,
      knobSize: on ? "24px" : "18px",
      hasTimes: !!(on && timeSets[key]),
      timeLabel: key === "audit" ? "Во сколько звать" : "Во сколько присылать",
      times: (timeSets[key] || []).map((tm) => ({ label: tm, checked: cur.time === tm ? "true" : "false", bg: cur.time === tm ? t.primaryBg : t.sheetTrack, ink: cur.time === tm ? t.primaryInk : t.ink, pick: () => setNotify({ time: tm }) }))
    };
  }
}
</script>
</body>
</html>
