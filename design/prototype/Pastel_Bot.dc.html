<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Daftar — бот в Telegram</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{t.chatBg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;">

<header style="flex: 0 0 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; background: {{t.head}}; box-shadow: 0 1px 0 {{t.headLine}}; z-index: 2;">
<a href="{{backHref}}" aria-label="Назад к чатам" style="flex: 0 0 44px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.accent}};"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<span aria-hidden="true" style="flex: 0 0 40px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: {{t.avatarBg}}; color: {{t.avatarInk}};"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="M7 0h10a7 7 0 0 1 7 7v10a7 7 0 0 1-7 7H7a7 7 0 0 1-7-7V7a7 7 0 0 1 7-7ZM6 7v2h12V7H6Zm0 4v2h8v-2H6Zm0 4v2h10v-2H6Z"></path></svg></span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
<span style="font-size: 16px; line-height: 1.2; font-weight: 600; color: {{t.title}};">Daftar</span>
<span style="font-size: 13px; line-height: 1.2; color: {{t.sub}};">{{status}}</span>
</div>
</header>

<div role="log" aria-label="Переписка с ботом Daftar" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column-reverse;">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 10px;">
<sc-for list="{{items}}" as="m" hint-placeholder-count="4">
<sc-if value="{{m.isPill}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: center; padding: 4px 0;"><span style="padding: 3px 10px; border-radius: 9999px; background: {{t.pill}}; color: #ffffff; font-size: 13px; font-weight: 600;">{{m.text}}</span></div>
</sc-if>
<sc-if value="{{m.isMe}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: flex-end; padding-left: 64px;">
<div style="max-width: 290px; box-sizing: border-box; padding: 6px 10px 5px 12px; border-radius: 16px 16px 4px 16px; background: {{t.out}}; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere;">
<div>{{m.text}}</div>
<div style="display: flex; justify-content: flex-end; gap: 3px; margin-top: 1px; font-size: 12px; color: {{t.outTime}};">{{m.time}}<span aria-hidden="true">✓✓</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">прочитано</span></div>
</div>
</div>
</sc-if>
<sc-if value="{{m.isVoice}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: flex-end; padding-left: 64px;">
<div role="img" aria-label="{{m.aria}}" style="width: 230px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 8px 10px 6px 8px; border-radius: 16px 16px 4px 16px; background: {{t.out}};">
<span aria-hidden="true" style="flex: 0 0 40px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: {{t.voiceBtn}}; color: {{t.voiceIcon}};"><svg width="16" height="16" viewBox="0 0 20 20"><path d="M6 4.2v11.6L15.5 10 6 4.2Z" fill="currentColor"></path></svg></span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<svg width="140" height="22" viewBox="0 0 140 22" aria-hidden="true" style="color: {{t.voiceWave}};"><g fill="currentColor"><rect x="0" y="9" width="3" height="4" rx="1.5"></rect><rect x="5" y="6" width="3" height="10" rx="1.5"></rect><rect x="10" y="3" width="3" height="16" rx="1.5"></rect><rect x="15" y="7" width="3" height="8" rx="1.5"></rect><rect x="20" y="4" width="3" height="14" rx="1.5"></rect><rect x="25" y="8" width="3" height="6" rx="1.5"></rect><rect x="30" y="2" width="3" height="18" rx="1.5"></rect><rect x="35" y="6" width="3" height="10" rx="1.5"></rect><rect x="40" y="9" width="3" height="4" rx="1.5"></rect><rect x="45" y="5" width="3" height="12" rx="1.5"></rect><rect x="50" y="3" width="3" height="16" rx="1.5"></rect><rect x="55" y="7" width="3" height="8" rx="1.5"></rect><rect x="60" y="9" width="3" height="4" rx="1.5"></rect><rect x="65" y="4" width="3" height="14" rx="1.5"></rect><rect x="70" y="6" width="3" height="10" rx="1.5"></rect><rect x="75" y="2" width="3" height="18" rx="1.5"></rect><rect x="80" y="8" width="3" height="6" rx="1.5"></rect><rect x="85" y="5" width="3" height="12" rx="1.5"></rect><rect x="90" y="9" width="3" height="4" rx="1.5"></rect><rect x="95" y="6" width="3" height="10" rx="1.5"></rect><rect x="100" y="8" width="3" height="6" rx="1.5"></rect><rect x="105" y="4" width="3" height="14" rx="1.5"></rect><rect x="110" y="9" width="3" height="4" rx="1.5"></rect><rect x="115" y="7" width="3" height="8" rx="1.5"></rect><rect x="120" y="9" width="3" height="4" rx="1.5"></rect></g></svg>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: {{t.outTime}};"><span>{{m.dur}}</span><span>{{m.time}} ✓✓</span></div>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{m.isPhoto}}" hint-placeholder-val="{{false}}">
<div style="display: flex; justify-content: flex-end; padding-left: 64px;">
<div style="width: 200px; box-sizing: border-box; padding: 4px; border-radius: 16px 16px 4px 16px; background: {{t.out}};">
<div role="img" aria-label="{{m.photoAria}}" style="position: relative; height: 230px; border-radius: 12px; overflow: hidden; background: #1c1d21;">
<div style="position: absolute; left: 50%; top: 50%; width: 140px; box-sizing: border-box; padding: 9px 9px 12px; background: #fbfbf8; color: #2a2a2e; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 7px; line-height: 1.5; transform: translate(-50%, -50%) rotate(-3deg); filter: {{m.blur}};">
<div style="text-align: center; font-weight: 700; font-size: 8px;">NAVRUZ MARKET</div>
<div style="margin: 4px 0; border-top: 1px dashed #9a9a9a;"></div>
<sc-for list="{{m.plines}}" as="pl" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between;"><span>{{pl.n}}</span><span>{{pl.p}}</span></div>
</sc-for>
<div style="display: flex; justify-content: space-between;"><span>…</span><span></span></div>
<div style="margin: 4px 0; border-top: 1px dashed #9a9a9a;"></div>
<div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 8px;"><span>ИТОГО</span><span>{{m.ptotal}}</span></div>
<div style="display: flex; justify-content: center; margin-top: 5px;"><svg width="30" height="30" viewBox="0 0 9 9" aria-hidden="true" shape-rendering="crispEdges"><path fill="#2a2a2e" d="M0 0h3v3H0zM6 0h3v3H6zM0 6h3v3H0zM4 0h1v1H4zM4 2h1v2H4zM3 4h2v1H3zM6 4h1v1H6zM8 4h1v2H8zM5 5h1v1H5zM4 6h1v1H4zM6 6h2v1H6zM5 7h1v2H5zM7 8h2v1H7z"></path><path fill="#fbfbf8" d="M1 1h1v1H1zM7 1h1v1H7zM1 7h1v1H1z"></path></svg></div>
</div>
<span style="position: absolute; right: 6px; bottom: 6px; padding: 1px 6px; border-radius: 9999px; background: rgba(0, 0, 0, 0.5); color: #ffffff; font-size: 12px;">{{m.time}} ✓✓</span>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{m.isBot}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-right: 40px;">
<div style="width: {{m.w}}; max-width: 310px; box-sizing: border-box; padding: 6px 12px 5px 12px; border-radius: 16px 16px 16px 4px; background: {{t.in}}; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere;">
<sc-for list="{{m.lines}}" as="l" hint-placeholder-count="2">
<sc-if value="{{l.isQuote}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 6px; padding: 3px 8px 4px 10px; border-left: 3px solid {{t.accent}}; border-radius: 4px; background: {{t.quoteBg}}; font-size: 15px; font-style: italic;">{{l.text}}</div>
</sc-if>
<sc-if value="{{l.isText}}" hint-placeholder-val="{{true}}">
<div style="margin-top: {{l.mt}}; font-weight: {{l.w}}; font-style: {{l.fs}}; text-decoration: {{l.td}}; color: {{l.c}}; font-size: {{l.fz}};">{{l.text}}</div>
</sc-if>
</sc-for>
<div style="display: flex; justify-content: flex-end; gap: 4px; margin-top: 1px; font-size: 12px; color: {{t.inTime}};">{{m.edited}}{{m.time}}</div>
</div>
<sc-if value="{{m.hasKb}}" hint-placeholder-val="{{false}}">
<div role="group" aria-label="{{m.kbAria}}" style="width: 310px; display: flex; flex-direction: column; gap: 4px;">
<sc-for list="{{m.kb}}" as="r" hint-placeholder-count="1">
<div style="display: flex; gap: 4px;">
<sc-for list="{{r.btns}}" as="b" hint-placeholder-count="2">
<sc-if value="{{b.isLink}}" hint-placeholder-val="{{false}}">
<a href="{{b.href}}" style="flex: 1 1 0; min-width: 0; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; border-radius: 12px; background: {{t.kb}}; color: #ffffff; font-size: 15px; font-weight: 600; line-height: 1.2; text-align: center; text-decoration: none; white-space: nowrap; overflow: hidden;"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis;">{{b.label}}</span><svg width="12" height="12" viewBox="0 0 20 20" aria-hidden="true" style="flex: 0 0 12px;"><path d="M7 4h9v9M16 4 5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
</sc-if>
<sc-if value="{{b.isChoice}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{b.go}}" aria-pressed="{{b.pressed}}" style="flex: 1 1 0; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 6px 10px; border: 0; border-radius: 12px; background: {{t.kb}}; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{b.label}}</button>
</sc-if>
<sc-if value="{{b.isBtn}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{b.go}}" style="flex: 1 1 0; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 6px 10px; border: 0; border-radius: 12px; background: {{t.kb}}; color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{b.label}}</button>
</sc-if>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>
</sc-for>
<sc-if value="{{typing}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="align-self: flex-start; display: flex; gap: 4px; padding: 12px 14px; border-radius: 16px 16px 16px 4px; background: {{t.in}};"><span style="width: 7px; height: 7px; border-radius: 9999px; background: {{t.inTime}};"></span><span style="width: 7px; height: 7px; border-radius: 9999px; background: {{t.inTime}}; opacity: 0.7;"></span><span style="width: 7px; height: 7px; border-radius: 9999px; background: {{t.inTime}}; opacity: 0.4;"></span></div>
</sc-if>
</div>
</div>

<div id="bot-cmds" role="listbox" aria-label="Команды бота" style="display: {{cmdDisplay}}; flex-direction: column; position: absolute; left: 8px; right: 8px; bottom: 68px; z-index: 3; padding: 4px 0; border-radius: 14px; background: {{t.menu}}; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.16);">
<sc-for list="{{cmds}}" as="c" hint-placeholder-count="4">
<button type="button" role="option" aria-selected="false" onClick="{{c.go}}" style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 14px; border: 0; background: transparent; color: {{t.text}}; font-family: inherit; text-align: left; cursor: pointer;"><span style="flex: 0 0 auto; font-size: 15px; font-weight: 600; color: {{t.accent}};">{{c.cmd}}</span><span style="flex: 1 1 auto; min-width: 0; font-size: 15px; color: {{t.muted}};">{{c.desc}}</span></button>
</sc-for>
</div>

<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 8px 14px; background: {{t.head}}; box-shadow: 0 -1px 0 {{t.headLine}};">
<a href="{{appHref}}" aria-label="Открыть приложение Daftar" style="flex: 0 0 auto; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 9999px; background: {{t.menuBtn}}; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14M3 10h14M3 15.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Открыть</a>
<input type="text" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" role="combobox" aria-expanded="{{cmdExpanded}}" aria-controls="bot-cmds" aria-autocomplete="list" aria-label="Сообщение боту" placeholder="Сообщение" enterkeyhint="send" style="flex: 1 1 auto; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 9999px; background: {{t.field}}; color: {{t.text}}; font-family: inherit; font-size: 16px; outline-color: {{t.accent}};">
<sc-if value="{{hasDraft}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{sendDraft}}" aria-label="Отправить" style="flex: 0 0 44px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9999px; background: {{t.menuBtn}}; color: #ffffff; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</sc-if>
<sc-if value="{{noDraft}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{voice}}" aria-label="Записать голосовое" style="flex: 0 0 44px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9999px; background: transparent; color: {{t.icon}}; cursor: pointer;"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.9"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg></button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"scene":{"editor":"enum","options":["text","edit","cats","unsure","fix","undo","errors","summary","reminders","start","commands","receipt","login"],"default":"text"},"appHref":{"editor":null,"default":"Pastel_Home.dc.html"},"analyticsHref":{"editor":null,"default":"Pastel_Analytics.dc.html"},"goalsHref":{"editor":null,"default":"Pastel_AuditDone.dc.html"},"receiptHref":{"editor":null,"default":"Pastel_ReceiptFromBot.dc.html"},"auditHref":{"editor":null,"default":"Pastel_Audit.dc.html"},"backHref":{"editor":null,"default":"Pastel_Home.dc.html"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    if (this.props.dark) {
      return { chatBg: "#0e1621", head: "#17212b", headLine: "rgba(0, 0, 0, 0.35)", title: "#ffffff", sub: "#7f91a4", accent: "#6ab3f3", text: "#f5f5f5", muted: "#8fa1b3", in: "#182533", out: "#2b5278", inTime: "#7f91a4", outTime: "#a9c6e6", kb: "rgba(255, 255, 255, 0.1)", pill: "rgba(255, 255, 255, 0.1)", quoteBg: "rgba(106, 179, 243, 0.1)", menu: "#17212b", menuBtn: "#2f6ea5", field: "#242f3d", icon: "#8fa1b3", voiceBtn: "#a9c6e6", voiceIcon: "#2b5278", voiceWave: "#a9c6e6", avatarBg: "#f4f4f6", avatarInk: "#141416" };
    }
    return { chatBg: "#e6ebee", head: "#ffffff", headLine: "rgba(0, 0, 0, 0.08)", title: "#111111", sub: "#6d7883", accent: "#1c6fb8", text: "#111111", muted: "#5f6b76", in: "#ffffff", out: "#e1f8cf", inTime: "#6d7883", outTime: "#2f7a33", kb: "rgba(54, 64, 75, 0.7)", pill: "rgba(54, 64, 75, 0.7)", quoteBg: "rgba(28, 111, 184, 0.08)", menu: "#ffffff", menuBtn: "#1c6fb8", field: "#f0f2f4", icon: "#5f6b76", voiceBtn: "#2f7a33", voiceIcon: "#ffffff", voiceWave: "#2f7a33", avatarBg: "#141416", avatarInk: "#ffffff" };
  }
  cats() {
    return {
      pr: "Продукты", kf: "Кафе", tr: "Транспорт", dm: "Дом", sv: "Связь", zd: "Здоровье", pk: "Покупки", dr: "Другое",
      zp: "Зарплата", fr: "Фриланс", bz: "Бизнес", pc: "Проценты", cb: "Кэшбэк", gf: "Подарки", vz: "Возврат", di: "Другое"
    };
  }
  expCats() { return ["pr", "kf", "tr", "dm", "sv", "zd", "pk", "dr"]; }
  incCats() { return ["zp", "fr", "bz", "pc", "cb", "gf", "vz", "di"]; }
  accs() { return { card: "Карта", cash: "Наличные", usd: "Доллары" }; }
  months() { return ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"]; }
  nb() { return String.fromCharCode(160); }
  fmtInt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, this.nb()); }
  plural(n, one, few, many) {
    const m10 = n % 10;
    const m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  amt(r) {
    if (r.cur === "USD") {
      const p = r.amount.toFixed(2).split(".");
      return this.fmtInt(parseInt(p[0], 10)) + "," + p[1] + this.nb() + "USD";
    }
    return this.fmtInt(r.amount) + this.nb() + "сум";
  }
  money(r) { return (r.type === "income" ? "+" : "−") + this.amt(r); }
  short(r) { return (r.type === "income" ? "+" : "−") + (r.cur === "USD" ? this.amt(r) : this.fmtInt(r.amount)); }
  cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  q(s) { return "«" + s + "»"; }
  // Слово, начинающееся с основы: «газ» не находится в «магазин», «нал» — в «анализы».
  hasStem(s, list) { return new RegExp("(?:^|[^а-яёa-z'])(?:" + list.join("|") + ")", "i").test(s); }
  isCash(s) { return /(?:^|[^а-яёa-z])(нал|налом|наличн[а-яё]*|наличк[а-яё]*|naqd)(?![а-яёa-z])/i.test(s); }
  guessCat(note) {
    const s = note.toLowerCase();
    const has = (list) => this.hasStem(s, list);
    if (has(["кредит", "рассрочк", "ипотек"])) return { type: "expense", cat: "dr" };
    if (has(["долг", "qarz"])) return { type: "expense", cat: "dr", unknown: true };
    if (has(["продукт", "супермаркет", "рынок", "хлеб", "молок", "корзинк", "korzinka", "макро", "non(?![a-z])", "bozor", "oziq"])) return { type: "expense", cat: "pr" };
    if (has(["кофе", "обед", "ужин", "завтрак", "кафе", "пицц", "доставк", "ресторан", "шаурм", "плов", "самс", "еда", "еды", "еду", "газировк", "qahva", "kofe", "ovqat", "tushlik"])) return { type: "expense", cat: "kf" };
    if (has(["такси", "метро", "бензин", "парковк", "автобус", "заправк", "taksi", "benzin"])) return { type: "expense", cat: "tr" };
    if (has(["коммунал", "аренд", "квартир", "посуд", "хозтовар", "ремонт", "свет(?![а-яё])", "газ(?![а-яё])", "kommunal", "ijara"])) return { type: "expense", cat: "dm" };
    if (has(["связь", "интернет", "телефон", "мобильн", "кинопоиск", "подписк", "второй номер", "internet", "telefon"])) return { type: "expense", cat: "sv" };
    if (has(["аптек", "врач", "стоматолог", "лекарств", "клиник", "анализ", "dori", "apteka"])) return { type: "expense", cat: "zd" };
    if (has(["одежд", "кроссовк", "наушник", "книг", "футболк", "обув", "чехол", "kiyim"])) return { type: "expense", cat: "pk" };
