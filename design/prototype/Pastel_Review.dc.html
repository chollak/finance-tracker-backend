<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Daftar — проверка записей</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 16px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;">

<header style="display: flex; align-items: center; gap: 12px; height: 48px;">
<a href="{{editHref}}" aria-label="Назад" style="flex: 0 0 44px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: {{t.card}}; color: {{t.ink}};"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
<h1 style="margin: 0; font-size: 18px; line-height: 1.3; font-weight: 800; letter-spacing: -0.3px;">Проверьте записи</h1>
</header>

<section aria-label="Исходный текст" style="display: flex; flex-direction: column; gap: 4px; padding: 14px 8px 4px 18px; border-radius: 24px; background: {{t.card}};">
<p style="margin: 0; padding-right: 10px; font-size: 15px; line-height: 1.45; font-weight: 500; color: {{t.ink}};">«кофе 25к, такси до работы 18 тысяч наличными, вчера пришло 300 долларов за лендинг»</p>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{t.muted}};"><span aria-hidden="true" style="flex: 0 0 22px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: #c9efd9; color: #14532d;"><svg width="12" height="12" viewBox="0 0 20 20"><path d="M4.5 10.5 8 14l7.5-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>{{summary}}</span>
<a href="{{editHref}}" style="height: 44px; padding: 0 10px; display: flex; align-items: center; color: {{t.ink}}; font-size: 14px; font-weight: 800;">Изменить</a>
</div>
</section>

<ul aria-label="Распознанные операции" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; gap: 8px; padding: 10px 6px 14px 18px; border-radius: 24px; background: {{it.card}};">
<div style="display: flex; align-items: center; gap: 8px;">
<div style="flex: 0 0 auto; display: flex; align-items: baseline; gap: 6px;">
<span style="font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.8px; white-space: nowrap; font-variant-numeric: tabular-nums; color: {{it.amountColor}};">{{it.amountText}}</span>
<span style="font-size: 13px; font-weight: 700; color: {{it.muted}};">{{it.unit}}</span>
</div>
<span style="flex: 1 1 auto; min-width: 0; text-align: right; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{it.muted}};">{{it.note}}</span>
<button type="button" onClick="{{it.remove}}" aria-label="{{it.removeAria}}" style="flex: 0 0 44px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9999px; background: transparent; color: {{it.muted}}; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 5.5l9 9m0-9-9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding-right: 12px;">
<button type="button" onClick="{{it.openCat}}" aria-haspopup="dialog" aria-label="{{it.catAria}}" style="height: 44px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: {{it.catBorder}}; border-radius: 9999px; background: {{it.catBg}}; color: {{it.catInk}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">
<span>{{it.cat}}</span>
<sc-if value="{{it.isUnsure}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true" style="font-weight: 800;">?</span>
</sc-if>
</button>
<button type="button" onClick="{{it.openAcc}}" aria-haspopup="dialog" aria-label="{{it.accAria}}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; border: 0; border-radius: 9999px; background: {{it.chip}}; color: {{it.ink}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">{{it.acc}}</button>
<button type="button" onClick="{{it.openDate}}" aria-haspopup="dialog" aria-label="{{it.dateAria}}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; border: 0; border-radius: 9999px; background: {{it.chip}}; color: {{it.ink}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">{{it.date}}</button>
</div>
<sc-if value="{{it.hasConv}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding-right: 12px;">
<span style="font-size: 13px; line-height: 1.35; font-weight: 600; color: {{it.muted}};">Валюта сменилась, число осталось прежним</span>
<button type="button" onClick="{{it.convert}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 9999px; background: {{it.chip}}; color: {{it.ink}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;">{{it.convLabel}}</button>
</div>
</sc-if>
</li>
</sc-for>
</ul>

<div style="margin-top: auto; display: flex; flex-direction: column;">
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<a href="{{homeHref}}" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: {{t.primaryBg}}; color: {{t.primaryInk}}; text-decoration: none; font-size: 16px; font-weight: 800;">{{saveLabel}}</a>
</sc-if>
<sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="{{yes}}" style="height: 56px; border: 0; border-radius: 9999px; background: {{t.track}}; color: {{t.muted}}; font-family: inherit; font-size: 16px; font-weight: 800;">Нечего сохранять</button>
</sc-if>
</div>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 88px; z-index: 15; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; border-radius: 24px; background: {{t.primaryBg}}; color: {{t.primaryInk}};">
<svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true" style="flex: 0 0 22px;"><path d="M4 6h12M8 6V4.5h4V6m-6.5 0 .8 9.5a1.5 1.5 0 0 0 1.5 1.4h4.4a1.5 1.5 0 0 0 1.5-1.4L14.5 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
<span style="font-size: 14px; font-weight: 800;">{{toastTitle}}</span>
<span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{t.primarySub}};">{{toastDetail}}</span>
</span>
<button type="button" onClick="{{undo}}" style="flex: 0 0 auto; height: 44px; padding: 0 14px; border: 0; border-radius: 9999px; background: transparent; color: {{t.primaryInk}}; font-family: inherit; font-size: 14px; font-weight: 800; text-decoration: underline; cursor: pointer;">Отменить</button>
</div>
</sc-if>

<sc-if value="{{pickerOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 30;">
<dc-import name="Pastel_Picker" dark="{{dark}}" kind="{{pickerKind}}" heading="{{pickerHeading}}" options="{{pickerOptions}}" selected="{{pickerSelected}}" min-month="2026-08" tentative="{{pickerTentative}}" on-pick="{{pickValue}}" on-close="{{closePicker}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"homeHref":{"editor":null,"default":"Pastel_Home.dc.html"},"editHref":{"editor":null,"default":"Pastel_Home.dc.html"},"startPicker":{"editor":null},"startPickerItem":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    if (this.props.dark) {
      return { bg: "#111214", card: "#1b1c1f", ink: "#f4f4f6", muted: "#9d9da6", track: "#26272b", income: "#6fd59a", primaryBg: "#f4f4f6", primaryInk: "#141416", primarySub: "#5d5d66" };
    }
    return { bg: "#f3f3f5", card: "#ffffff", ink: "#141416", muted: "#6b6b74", track: "#e7e7ec", income: "#15803d", primaryBg: "#141416", primaryInk: "#ffffff", primarySub: "#b5b5bd" };
  }
  plural(n, one, few, many) {
    const m10 = n % 10;
    const m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  expCats() { return [["pr", "Продукты", "#ffdcc8"], ["kf", "Кафе", "#ffd6e0"], ["tr", "Транспорт", "#cfe3ff"], ["dm", "Дом", "#ede3d6"], ["sv", "Связь", "#e3dcff"], ["zd", "Здоровье", "#c9efd9"], ["pk", "Покупки", "#fbefb3"], ["dr", "Другое", "#e6e6ea"]]; }
  incCats() { return [["zp", "Зарплата", "#c9efd9"], ["fr", "Фриланс", "#e3dcff"], ["bz", "Бизнес", "#cfe3ff"], ["pd", "Подарки", "#ffd6e0"], ["kb", "Кэшбэк", "#fbefb3"], ["pc", "Проценты", "#ffdcc8"], ["vz", "Возврат", "#ede3d6"], ["dx", "Другое", "#e6e6ea"]]; }
  catInfo(id) {
    const c = this.expCats().concat(this.incCats()).find((x) => x[0] === id);
    return c ? { name: c[1], color: c[2] } : { name: "Без категории", color: "#e6e6ea" };
  }
  accOpts() { return [{ id: "cash", name: "Наличные", bal: "1 250 000 сум" }, { id: "card", name: "Карта", bal: "3 180 000 сум" }, { id: "usd", name: "Доллары", bal: "420,00 USD" }]; }
  accName(id) { return id === "cash" ? "Наличные" : (id === "usd" ? "Доллары" : "Карта"); }
  dateLabel(iso) {
    const ym = iso.slice(0, 7);
    const m = parseInt(iso.slice(5, 7), 10) - 1;
    const d = parseInt(iso.slice(8, 10), 10);
    if (ym === "2026-10" && d === 14) return "Сегодня";
    if (ym === "2026-10" && d === 13) return "Вчера, 13 окт";
    return d + " " + ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"][m];
  }
  fmtInt(s) { return String(s).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  fmtNum(n, usd) {
    if (usd) { const p = Number(n).toFixed(2).split("."); return this.fmtInt(p[0]) + "," + p[1]; }
    return this.fmtInt(Math.round(Number(n)));
  }
  seed() {
    return [
      { id: "a", type: "expense", cat: "kf", unsure: true, amount: 25000, acc: "card", date: "2026-10-14", note: "кофе" },
      { id: "b", type: "expense", cat: "tr", unsure: false, amount: 18000, acc: "cash", date: "2026-10-14", note: "такси до работы" },
      { id: "c", type: "income", cat: "fr", unsure: false, amount: 300, acc: "usd", date: "2026-10-13", note: "за лендинг" }
    ];
  }
  st() {
    const s = this.state || {};
    const startPicker = this.props.startPicker ? { id: this.props.startPickerItem ?? "a", kind: this.props.startPicker } : null;
    return {
      items: s.items || this.seed(),
      removed: s.removed || {},
      hints: s.hints || {},
      undo: s.undo || [],
      picker: s.picker !== undefined ? s.picker : startPicker
    };
  }
  timers() { if (!this._timers) this._timers = {}; return this._timers; }
  removeItem(id) {
    const s = this.st();
    const x = s.items.find((y) => y.id === id);
    const r = Object.assign({}, s.removed);
    r[id] = true;
    const key = "u" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    const usd = x.acc === "usd";
    const detail = this.catInfo(x.cat).name + " · " + (x.type === "income" ? "+" : "−") + this.fmtNum(x.amount, usd) + (usd ? " USD" : " сум");
    this.setState({ removed: r, undo: s.undo.concat([{ key: key, id: id, title: "Убрано", detail: detail }]) });
    this.timers()[key] = setTimeout(() => {
      delete this.timers()[key];
      this.setState((prev) => ({ undo: ((prev && prev.undo) || []).filter((u) => u.key !== key) }));
    }, 4000);
  }
  undo() {
    const s = this.st();
    const top = s.undo[s.undo.length - 1];
    if (!top) return;
    clearTimeout(this.timers()[top.key]);
    delete this.timers()[top.key];
    const r = Object.assign({}, s.removed);
    delete r[top.id];
    this.setState({ removed: r, undo: s.undo.slice(0, -1) });
  }
  convert(id) {
    const s = this.st();
    const h = s.hints[id];
    if (!h) return;
    const hints = Object.assign({}, s.hints);
    delete hints[id];
    this.setState({ items: s.items.map((x) => (x.id === id ? Object.assign({}, x, { amount: h.amount }) : x)), hints: hints });
  }
  componentWillUnmount() {
    const tm = this.timers();
    Object.keys(tm).forEach((k) => clearTimeout(tm[k]));
  }
  pickValue(val) {
    const s = this.st();
    const p = s.picker;
    if (!p) return;
    const hints = Object.assign({}, s.hints);
    const items = s.items.map((x) => {
      if (x.id !== p.id) return x;
      if (p.kind === "category") return Object.assign({}, x, { cat: val, unsure: false });
      if (p.kind === "date") return Object.assign({}, x, { date: val });
      if (val === x.acc) return x;
      const origin = hints[x.id] ? hints[x.id].origin : { acc: x.acc, amount: x.amount };
      const isUsd = val === "usd";
      if ((origin.acc === "usd") === isUsd) {
        delete hints[x.id];
      } else {
        const conv = isUsd ? Math.round((origin.amount / 12650) * 100) / 100 : Math.round(origin.amount * 12650);
        hints[x.id] = { origin: origin, amount: conv, label: "Пересчитать: " + this.fmtNum(conv, isUsd) + (isUsd ? " USD" : " сум") };
      }
      return Object.assign({}, x, { acc: val });
    });
    this.setState({ items: items, picker: null, hints: hints });
  }
  renderVals() {
    const t = this.theme();
    const s = this.st();
    const live = s.items.filter((d) => !s.removed[d.id]);
    const items = live.map((d) => {
      const usd = d.acc === "usd";
      const sign = d.type === "income" ? "+" : "−";
      const amount = this.fmtNum(d.amount, usd);
      const c = this.catInfo(d.cat);
      const acc = this.accName(d.acc);
      const date = this.dateLabel(d.date);
      const unit = usd ? "USD" : "сум";
      return {
        amountText: sign + amount,
        unit: unit,
        note: d.note,
        cat: c.name,
        acc: acc,
        date: date,
        isUnsure: d.unsure,
        amountColor: d.type === "income" ? t.income : t.ink,
        catBg: d.unsure ? "transparent" : c.color,
        catInk: d.unsure ? t.ink : "#141416",
        catBorder: d.unsure ? "2px dashed " + t.muted : "2px solid transparent",
        catAria: "Категория: " + c.name + (d.unsure ? ", не уверен — проверьте" : "") + ". Изменить",
        accAria: "Счёт: " + acc + ". Изменить",
        dateAria: "Дата: " + date + ". Изменить",
        removeAria: "Убрать: " + c.name + ", " + sign + amount + " " + unit,
        remove: () => this.removeItem(d.id),
        openCat: () => this.setState({ picker: { id: d.id, kind: "category" } }),
        openAcc: () => this.setState({ picker: { id: d.id, kind: "account" } }),
        openDate: () => this.setState({ picker: { id: d.id, kind: "date" } }),
        hasConv: !!s.hints[d.id],
        convLabel: s.hints[d.id] ? s.hints[d.id].label : "",
        convert: () => this.convert(d.id),
        card: t.card,
        chip: t.track,
        ink: t.ink,
        muted: t.muted
      };
    });
    const n = items.length;
    const unsure = live.filter((d) => d.unsure).length;
    const summary = n === 0
      ? "Ничего не осталось"
      : n + " " + this.plural(n, "операция", "операции", "операций") + (unsure ? " · " + unsure + " проверить" : "");

    const pItem = s.picker ? live.find((x) => x.id === s.picker.id) : null;
    const pk = pItem ? s.picker.kind : null;
    let pickerOptions = null;
    let pickerSelected = null;
    let pickerHeading = "";
    if (pk === "category") {
      pickerOptions = (pItem.type === "income" ? this.incCats() : this.expCats()).map((d) => ({ id: d[0], name: d[1], color: d[2] }));
      pickerSelected = pItem.cat;
      pickerHeading = pItem.type === "income" ? "Категория дохода" : "Категория расхода";
    }
    if (pk === "account") { pickerOptions = this.accOpts(); pickerSelected = pItem.acc; pickerHeading = "Счёт"; }
    if (pk === "date") { pickerSelected = pItem.date; pickerHeading = "Дата"; }

    return {
      t: t,
      yes: true,
      dark: !!this.props.dark,
      homeHref: this.props.homeHref ?? "Pastel_Home.dc.html",
      editHref: this.props.editHref ?? "Pastel_Home.dc.html",
      items: items,
      summary: summary,
      hasItems: n > 0,
      noItems: n === 0,
      saveLabel: "Сохранить " + n + " " + this.plural(n, "операцию", "операции", "операций"),
      hasToast: s.undo.length > 0 && !pk,
      toastTitle: s.undo.length ? s.undo[s.undo.length - 1].title : "",
      toastDetail: s.undo.length ? s.undo[s.undo.length - 1].detail : "",
      undo: () => this.undo(),
      pickerOpen: !!pk,
      pickerKind: pk || "category",
      pickerHeading: pickerHeading,
      pickerOptions: pickerOptions,
      pickerSelected: pickerSelected,
      pickerTentative: pk === "category" && !!pItem && pItem.unsure,
      pickValue: (v) => this.pickValue(v),
      closePicker: () => this.setState({ picker: null })
    };
  }
}
</script>
</body>
</html>
