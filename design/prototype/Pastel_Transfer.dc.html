<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Daftar — перевод между счетами</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 24px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<p role="status" style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;">{{liveText}}</p>
<header style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; height: 48px;">
<sc-if value="{{hasClose}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{close}}" aria-label="Назад" style="flex: 0 0 44px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9999px; background: {{t.card}}; color: {{t.ink}}; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</sc-if>
<sc-if value="{{noClose}}" hint-placeholder-val="{{true}}">
<a href="{{backHref}}" aria-label="Назад" style="flex: 0 0 44px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: {{t.card}}; color: {{t.ink}};"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
</sc-if>
<h1 id="tr-title" tabindex="-1" style="flex: 1 1 auto; margin: 0; outline: none; font-size: 18px; line-height: 1.3; font-weight: 800; letter-spacing: -0.3px;">{{title}}</h1>
</header>

<section aria-label="{{fromLabel}}" style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 14px; border-radius: 24px; background: {{t.card}};">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<span style="font-size: 13px; font-weight: 700; color: {{t.muted}};">{{fromLabel}}</span>
<button type="button" onClick="{{pickFrom}}" aria-haspopup="dialog" aria-label="{{fromAria}}" style="height: 44px; margin-right: -8px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 9999px; background: transparent; color: {{t.ink}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;">{{fromName}}<svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5 10 12.5l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<button type="button" onClick="{{focusOut}}" aria-label="{{outAria}}" aria-pressed="{{outActive}}" style="min-height: 52px; display: flex; align-items: center; gap: 6px; padding: 4px 12px; margin: 0 -12px; border: 0; border-radius: 16px; background: transparent; box-shadow: {{outRing}}; color: {{t.ink}}; font-family: inherit; text-align: left; cursor: pointer;"><span style="font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; color: {{outInk}};">{{outText}}</span><span style="font-size: 15px; font-weight: 700; color: {{t.muted}};">{{fromUnit}}</span></button>
<span style="font-size: 13px; line-height: 1.4; font-weight: 600; color: {{fromNoteInk}};">{{fromNote}}</span>
</section>

<section aria-label="{{toLabel}}" style="flex: 0 0 auto; position: relative; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 14px; border-radius: 24px; background: {{t.card}};">
<button type="button" onClick="{{swap}}" aria-label="Поменять счета местами" style="position: absolute; left: 50%; top: -27px; transform: translateX(-50%); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 4px solid {{t.bg}}; border-radius: 9999px; background: {{t.card}}; color: {{t.ink}}; cursor: pointer; z-index: 1;"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4v12m-3-3 3 3 3-3M13 16V4m-3 3 3-3 3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0;"><span style="font-size: 13px; font-weight: 700; color: {{t.muted}};">{{toLabel}}</span><sc-if value="{{isAuto}}" hint-placeholder-val="{{false}}"><span style="padding: 3px 10px; border-radius: 9999px; background: {{t.track}}; color: {{t.ink}}; font-size: 12px; font-weight: 800; white-space: nowrap;">по курсу ЦБ</span></sc-if></span>
<button type="button" onClick="{{pickTo}}" aria-haspopup="dialog" aria-label="{{toAria}}" style="height: 44px; margin-right: -8px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border: 0; border-radius: 9999px; background: transparent; color: {{t.ink}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;">{{toName}}<svg width="14" height="14" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5 10 12.5l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
</div>
<sc-if value="{{isFx}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{focusIn}}" aria-label="{{inAria}}" aria-pressed="{{inActive}}" style="min-height: 52px; display: flex; align-items: center; gap: 6px; padding: 4px 12px; margin: 0 -12px; border: 0; border-radius: 16px; background: transparent; box-shadow: {{inRing}}; color: {{t.ink}}; font-family: inherit; text-align: left; cursor: pointer;"><span style="font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; color: {{inInk}};">{{inText}}</span><span style="font-size: 15px; font-weight: 700; color: {{t.muted}};">{{toUnit}}</span></button>
</sc-if>
<span style="font-size: 13px; line-height: 1.4; font-weight: 600; color: {{t.muted}};">{{toNote}}</span>
</section>

<sc-if value="{{hasDeal}}" hint-placeholder-val="{{false}}">
<section aria-label="Курс сделки" style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 24px; background: {{t.track}};">
<span style="font-size: 15px; font-weight: 800;">{{dealTitle}}</span>
<span style="font-size: 13px; line-height: 1.45; font-weight: 600; color: {{t.muted}};">{{dealText}}</span>
</section>
</sc-if>
<p style="flex: 0 0 auto; margin: 0 4px; font-size: 13px; line-height: 1.45; font-weight: 600; color: {{t.muted}};">{{note}}</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
<div role="group" aria-label="Цифровая клавиатура" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9999px; background: {{t.card}}; color: {{t.ink}}; font-family: inherit; font-size: {{k.size}}; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer;">
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="m12 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{k.isText}}" hint-placeholder-val="{{true}}"><span>{{k.label}}</span></sc-if>
</button>
</sc-for>
</div>
<button type="button" onClick="{{submit}}" aria-disabled="{{disabled}}" style="height: 56px; border: 0; border-radius: 9999px; background: {{btnBg}}; color: {{btnInk}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;">{{btnLabel}}</button>
</div>

<sc-if value="{{pickerOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 30;">
<dc-import name="Pastel_Picker" dark="{{dark}}" kind="account" heading="{{pickerHeading}}" options="{{pickerOptions}}" selected="{{pickerSelected}}" on-pick="{{pickValue}}" on-close="{{closePicker}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"fx":{"editor":"boolean","default":false},"preset":{"editor":null},"cbuRate":{"editor":null},"from":{"editor":null},"accs":{"editor":null},"onClose":{"editor":null},"onDone":{"editor":null},"backHref":{"editor":null,"default":"Pastel_Accounts.dc.html"},"homeHref":{"editor":null,"default":"Pastel_Home.dc.html"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    if (this.props.dark) {
      return { bg: "#111214", card: "#1b1c1f", ink: "#f4f4f6", muted: "#9d9da6", track: "#26272b", primaryBg: "#f4f4f6", primaryInk: "#141416", off: "#b0b0b8" };
    }
    return { bg: "#f3f3f5", card: "#ffffff", ink: "#141416", muted: "#6b6b74", track: "#e7e7ec", primaryBg: "#141416", primaryInk: "#ffffff", off: "#5d5d66" };
  }
  nb() { return String.fromCharCode(160); }
  fmtInt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, this.nb()); }
  fmtUsd(n) { const p = Number(n).toFixed(2).split("."); return this.fmtInt(parseInt(p[0], 10)) + "," + p[1]; }
  // Счета приходят со страницы «Счета»; отдельно открытый экран берёт стандартные.
  accs() {
    const list = this.props.accs || [{ id: "cash", name: "Наличные", cur: "UZS", balance: 1250000 }, { id: "card", name: "Карта", cur: "UZS", balance: 3180000 }, { id: "usd", name: "Доллары", cur: "USD", balance: 420 }];
    const m = {};
    list.forEach((a) => { m[a.id] = a; });
    return m;
  }
  money(n, cur) { return cur === "USD" ? this.fmtUsd(n) + this.nb() + "USD" : this.fmtInt(n) + this.nb() + "сум"; }
  cbu() { return this.props.cbuRate || 12650; }
  st() {
    const A = this.accs();
    const fx = !!this.props.fx;
    const from = this.props.from && A[this.props.from] ? this.props.from : (A.card ? "card" : Object.keys(A)[0]);
    const others = Object.keys(A).filter((id) => id !== from);
    const to = fx ? (others.find((id) => A[id].cur !== A[from].cur) || others[0]) : (others.find((id) => A[id].cur === A[from].cur) || others[0]);
    const preset = this.props.preset ?? !this.props.accs;
    return Object.assign({ from: from, to: to, out: preset ? (fx ? "1280000" : "500000") : "", inn: preset && fx ? "100" : "", innTouched: preset && fx, field: preset && fx ? "inn" : "out", picker: null, done: false, fresh: true }, this.state || {});
  }
  num(str) { return str ? parseFloat(String(str).replace(",", ".")) : 0; }
  show(str, cur) {
    if (!str) return "0";
    if (cur === "USD") { const p = String(str).split(","); return this.fmtInt(parseInt(p[0] || "0", 10)) + (p.length > 1 ? "," + p[1] : ""); }
    return this.fmtInt(parseInt(str, 10));
  }
  press(k) {
    const s = this.st();
    const A = this.accs();
    const field = s.field;
    const cur = field === "out" ? A[s.from].cur : A[s.to].cur;
    // Первая цифра заменяет сумму, «⌫» и «000» правят её.
    let a = s.fresh && k !== "back" && k !== "000" ? "" : s[field];
    if (k === "back") a = a.slice(0, -1);
    else if (k === "000") { if (a !== "" && a !== "0" && a.length <= 8) a = a + "000"; }
    else if (k === ",") { if (cur === "USD" && a.indexOf(",") === -1) a = (a === "" ? "0" : a) + ","; }
    else {
      const ci = a.indexOf(",");
      if (ci !== -1 && a.length - ci > 2) return;
      if (a === "0") a = k; else if (a.replace(",", "").length < 11) a = a + k;
    }
    const patch = { fresh: false };
    patch[field] = a;
    if (field === "inn") patch.innTouched = true;
    this.setState(patch);
  }
  focusTitle() {
    if (typeof document === "undefined") return;
    setTimeout(() => { const h = document.getElementById("tr-title"); if (h) h.focus(); }, 60);
  }
  renderVals() {
    const t = this.theme();
    const s = this.st();
    const A = this.accs();
    const from = A[s.from];
    // Если второго счёта нет — форма не даёт отправить (на «Счетах» кнопка тоже выключена).
    const to = A[s.to] || from;
    const fx = from.cur !== to.cur;
    const out = this.num(s.out);
    // Пока «Получаю» не трогали — считаем по ЦБ; введённая сумма задаёт курс сделки.
    const autoIn = fx ? (from.cur === "UZS" ? Math.round((out / this.cbu()) * 100) / 100 : Math.round(out * this.cbu())) : out;
    const inn = fx ? (s.innTouched ? this.num(s.inn) : autoIn) : out;
    const uzs = from.cur === "UZS" ? out : inn;
    const usd = from.cur === "USD" ? out : inn;
    const rate = fx && usd > 0 ? Math.round(uzs / usd) : 0;
    const over = out > from.balance;
    const ok = out > 0 && inn > 0 && !over && !!A[s.to] && s.from !== s.to;
    const activeOut = s.field === "out";
    const keyCur = activeOut ? from.cur : to.cur;
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", keyCur === "USD" ? "," : "000", "0", "back"].map((k) => ({ label: k, aria: k === "back" ? "Стереть" : (k === "000" ? "Три нуля" : (k === "," ? "Запятая" : k)), isBack: k === "back", isText: k !== "back", size: k === "000" ? "17px" : "23px", press: () => this.press(k) }));
    // Сколько потеряно или выиграно против курса ЦБ, в сумах.
    const vsCbu = fx && rate ? Math.round(from.cur === "UZS" ? uzs - usd * this.cbu() : usd * this.cbu() - uzs) : 0;
    const atCbu = Math.round(usd * this.cbu());
    const dealText = !rate ? "" : (vsCbu === 0 ? "Ровно по курсу ЦБ." : "По курсу ЦБ — " + this.money(atCbu, "UZS") + ", разница " + this.money(Math.abs(vsCbu), "UZS") + (vsCbu > 0 ? " не в вашу пользу." : " в вашу пользу."));
    let note = "Перевод не попадает в расходы и аналитику — деньги просто меняют счёт.";
    if (fx) note = s.innTouched ? "Обмен не попадает в расходы и аналитику. Курс сделки сохранится в записи." : "Введите, сколько пришло на самом деле, — запишу точный курс. Обмен не попадает в расходы и аналитику.";
    const pk = s.picker;
    const opts = Object.keys(A).map((id) => ({ id: id, name: A[id].name, bal: this.money(A[id].balance, A[id].cur) }));
    const ring = "inset 0 0 0 2px " + t.ink;
    const btnLabel = ok ? (fx ? "Обменять" : "Перевести") + " " + this.money(out, from.cur) : (over ? "Не хватает денег на счёте" : (fx && out > 0 ? "Введите, сколько получили" : "Введите сумму"));
    return {
      t: t,
      dark: !!this.props.dark,
      liveText: over ? "Не хватает денег: на счёте «" + from.name + "» " + this.money(from.balance, from.cur) : (fx && rate ? "Курс сделки " + this.fmtInt(rate) + " сум за доллар" : ""),
      title: fx ? "Обмен" : "Перевод",
      hasClose: !!this.props.onClose,
      noClose: !this.props.onClose,
      close: () => { if (this.props.onClose) this.props.onClose(); },
      backHref: this.props.backHref ?? "Pastel_Accounts.dc.html",
      homeHref: this.props.homeHref ?? "Pastel_Home.dc.html",
      fromLabel: fx ? "Отдаю" : "Откуда",
      toLabel: fx ? "Получаю" : "Куда",
      fromName: from.name,
      fromAria: (fx ? "Отдаю со счёта " : "Откуда: счёт ") + from.name + ", " + this.money(from.balance, from.cur) + ". Выбрать другой счёт",
      toName: to.name,
      toAria: (fx ? "Получаю на счёт " : "Куда: счёт ") + to.name + ". Выбрать другой счёт",
      outText: this.show(s.out, from.cur),
      outInk: out > 0 ? t.ink : t.muted,
      fromUnit: from.cur === "USD" ? "USD" : "сум",
      outAria: (fx ? "Отдаю: " : "Сумма: ") + this.money(out, from.cur) + (activeOut ? ", вводится сейчас" : ". Ввести"),
      outActive: activeOut ? "true" : "false",
      outRing: fx && activeOut ? ring : "none",
      fromNote: over ? "На счёте «" + from.name + "» только " + this.money(from.balance, from.cur) + " — меньше суммы" : "На счёте " + this.money(from.balance, from.cur) + (out > 0 ? " · останется " + this.money(from.balance - out, from.cur) : ""),
      fromNoteInk: over ? t.ink : t.muted,
      isFx: fx,
      isAuto: fx && !s.innTouched,
      inText: s.innTouched ? this.show(s.inn, to.cur) : (to.cur === "USD" ? this.fmtUsd(autoIn) : this.fmtInt(autoIn)),
      inInk: s.innTouched && inn > 0 ? t.ink : t.muted,
      toUnit: to.cur === "USD" ? "USD" : "сум",
      inAria: "Получаю: " + this.money(inn, to.cur) + (s.innTouched ? "" : ", посчитано по курсу ЦБ") + (activeOut ? ". Ввести" : ", вводится сейчас"),
      inActive: activeOut ? "false" : "true",
      inRing: !activeOut ? ring : "none",
      toNote: "На счёте " + this.money(to.balance, to.cur) + (inn > 0 ? " · станет " + this.money(to.balance + inn, to.cur) : ""),
      hasDeal: fx && s.innTouched && rate > 0,
      dealTitle: "Курс сделки: " + this.fmtInt(rate) + " сум за $1",
      dealText: dealText,
      focusOut: () => this.setState({ field: "out", fresh: true }),
      // Автосумму можно поправить «⌫», а первая цифра заменит её целиком.
      focusIn: () => this.setState(s.innTouched ? { field: "inn", fresh: true } : { field: "inn", fresh: true, inn: to.cur === "USD" ? autoIn.toFixed(2).replace(".", ",") : String(autoIn) }),
      swap: () => this.setState(fx ? { from: s.to, to: s.from, out: s.innTouched ? s.inn : (to.cur === "USD" ? autoIn.toFixed(2).replace(".", ",") : String(autoIn)), inn: s.innTouched ? s.out : "", innTouched: s.innTouched, field: "out", fresh: true } : { from: s.to, to: s.from, field: "out", fresh: true }),
      note: note,
      keys: keys,
      disabled: ok ? "false" : "true",
      btnBg: ok ? t.primaryBg : t.track,
      btnInk: ok ? t.primaryInk : t.off,
      btnLabel: btnLabel,
      submit: () => {
        if (!ok) return;
        const result = { from: s.from, to: s.to, out: out, inn: inn, fx: fx, rate: rate };
        if (this.props.onDone) this.props.onDone(result);
        else this.setState({ done: true, picker: null });
      },
      done: !!s.done,
      result: { from: s.from, to: s.to, out: out, inn: inn, fx: fx, rate: rate },
      pickFrom: () => this.setState({ picker: "from" }),
      pickTo: () => this.setState({ picker: "to" }),
      pickerOpen: !!pk,
      pickerHeading: pk === "from" ? (fx ? "Отдаю со счёта" : "Откуда") : (fx ? "Получаю на счёт" : "Куда"),
      pickerOptions: opts.filter((o) => o.id !== (pk === "from" ? s.to : s.from)),
      pickerSelected: pk === "from" ? s.from : s.to,
      pickValue: (v) => {
        const cur = this.st();
        const patch = { picker: null, field: "out", fresh: true, innTouched: false, inn: "" };
        if (cur.picker === "from") patch.from = v; else patch.to = v;
        if (A[patch.from || cur.from].cur !== A[cur.from].cur) patch.out = "";
        this.setState(patch);
        this.focusTitle();
      },
      closePicker: () => this.setState({ picker: null })
    };
  }
}
</script>
</body>
</html>
