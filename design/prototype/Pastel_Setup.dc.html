<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Daftar — первый запуск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 8px 16px 24px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<p role="status" style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;">{{liveText}}</p>
<header style="flex: 0 0 auto; display: flex; align-items: center; gap: 10px; height: 48px;">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M7 0h10a7 7 0 0 1 7 7v10a7 7 0 0 1-7 7H7a7 7 0 0 1-7-7V7a7 7 0 0 1 7-7ZM6 7v2h12V7H6Zm0 4v2h8v-2H6Zm0 4v2h10v-2H6Z"></path></svg>
<span style="font-size: 23px; line-height: 1; font-weight: 800; letter-spacing: -0.7px;">daftar</span>
</header>
<div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; padding: 4px 4px 0;">
<h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 800; letter-spacing: -0.8px;">Сколько у вас сейчас денег?</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; font-weight: 500; color: {{t.muted}};">С этих сумм Daftar начнёт считать. Это не доход — просто остатки на сегодня.</p>
</div>
<div role="radiogroup" aria-label="Какой остаток вводить" onKeyDown="{{onKey}}" style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; padding: 4px; border-radius: 24px; background: {{t.card}};">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<button type="button" role="radio" onClick="{{r.pick}}" aria-checked="{{r.active}}" aria-label="{{r.aria}}" style="min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 0; border-radius: 20px; background: transparent; box-shadow: {{r.ring}}; color: {{t.ink}}; font-family: inherit; text-align: left; cursor: pointer;">
<span aria-hidden="true" style="flex: 0 0 40px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; background: {{t.track}}; font-size: 17px; font-weight: 800;">
<sc-if value="{{r.isUsd}}" hint-placeholder-val="{{false}}">$</sc-if>
<sc-if value="{{r.isCard}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect><path d="M2.5 8.5h15" stroke="currentColor" stroke-width="1.8"></path></svg></sc-if>
<sc-if value="{{r.isCash}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="5.5" width="16" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"></rect><circle cx="10" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.6"></circle></svg></sc-if>
</span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 15px; font-weight: 700;">{{r.name}}</span><span style="font-size: 13px; font-weight: 600; color: {{t.muted}};">{{r.sub}}</span></span>
<span style="flex: 0 0 auto; display: flex; align-items: baseline; gap: 4px;"><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; white-space: nowrap; color: {{r.ink}};">{{r.value}}</span><span style="font-size: 13px; font-weight: 700; color: {{t.muted}};">{{r.unit}}</span></span>
</button>
</sc-for>
</div>
<p style="flex: 0 0 auto; margin: 0 4px; font-size: 13px; line-height: 1.45; font-weight: 600; color: {{t.muted}};">{{note}}</p>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
<div role="group" aria-label="Цифровая клавиатура" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 9999px; background: {{t.card}}; color: {{t.ink}}; font-family: inherit; font-size: {{k.size}}; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer;">
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7 6-7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="m12 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg></sc-if>
<sc-if value="{{k.isText}}" hint-placeholder-val="{{true}}"><span>{{k.label}}</span></sc-if>
</button>
</sc-for>
</div>
<button type="button" onClick="{{finish}}" style="height: 56px; border: 0; border-radius: 9999px; background: {{t.primaryBg}}; color: {{t.primaryInk}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;">{{btnLabel}}</button>
</div>

<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 40;">
<dc-import name="Pastel_Home" dark="{{dark}}" fresh="{{fresh}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"filled":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    if (this.props.dark) return { bg: "#111214", card: "#1b1c1f", ink: "#f4f4f6", muted: "#9d9da6", track: "#26272b", primaryBg: "#f4f4f6", primaryInk: "#141416" };
    return { bg: "#f3f3f5", card: "#ffffff", ink: "#141416", muted: "#6b6b74", track: "#e7e7ec", primaryBg: "#141416", primaryInk: "#ffffff" };
  }
  nb() { return String.fromCharCode(160); }
  fmtInt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, this.nb()); }
  accs() { return [{ id: "cash", name: "Наличные", sub: "сумы · наличные", cur: "UZS" }, { id: "card", name: "Карта", sub: "сумы · карта", cur: "UZS" }, { id: "usd", name: "Доллары", sub: "доллары · наличные", cur: "USD" }]; }
  st() {
    const f = !!this.props.filled;
    return Object.assign({ vals: f ? { cash: "1250000", card: "3180000", usd: "420" } : { cash: "", card: "", usd: "" }, active: f ? "usd" : "cash", fresh: true, done: false }, this.state || {});
  }
  num(str) { return str ? parseFloat(String(str).replace(",", ".")) : 0; }
  show(str, cur) {
    if (!str) return "0";
    if (cur === "USD") { const p = String(str).split(","); return this.fmtInt(parseInt(p[0] || "0", 10)) + (p.length > 1 ? "," + p[1] : ""); }
    return this.fmtInt(parseInt(str, 10));
  }
  press(k) {
    const s = this.st();
    const cur = s.active === "usd" ? "USD" : "UZS";
    // Первая цифра после выбора строки заменяет число, «⌫» и «000» правят его.
    let a = s.fresh && k !== "back" && k !== "000" ? "" : s.vals[s.active];
    if (k === "back") a = a.slice(0, -1);
    else if (k === "000") { if (a !== "" && a !== "0" && a.indexOf(",") === -1 && a.length <= 8) a = a + "000"; }
    else if (k === ",") { if (cur === "USD" && a.indexOf(",") === -1) a = (a === "" ? "0" : a) + ","; }
    else {
      const ci = a.indexOf(",");
      if (ci !== -1 && a.length - ci > 2) return;
      if (a === "0") a = k; else if (a.replace(",", "").length < 11) a = a + k;
    }
    const vals = Object.assign({}, s.vals);
    vals[s.active] = a;
    this.setState({ vals: vals, fresh: false });
  }
  renderVals() {
    const t = this.theme();
    const s = this.st();
    const rate = 12650;
    const total = this.num(s.vals.cash) + this.num(s.vals.card) + this.num(s.vals.usd) * rate;
    const any = total > 0;
    const keyCur = s.active === "usd" ? "USD" : "UZS";
    const act = this.accs().find((a) => a.id === s.active);
    return {
      t: t,
      dark: !!this.props.dark,
      liveText: act.name + ": " + this.show(s.vals[s.active], act.cur) + (act.cur === "USD" ? " долларов" : " сум"),
      rows: this.accs().map((a) => ({
        name: a.name, sub: a.sub, isUsd: a.cur === "USD", isCard: a.id === "card", isCash: a.id === "cash",
        value: this.show(s.vals[a.id], a.cur), unit: a.cur === "USD" ? "USD" : "сум",
        ink: this.num(s.vals[a.id]) > 0 ? t.ink : t.muted,
        active: s.active === a.id ? "true" : "false",
        ring: s.active === a.id ? "inset 0 0 0 2px " + t.ink : "none",
        aria: a.name + ": " + this.show(s.vals[a.id], a.cur) + (a.cur === "USD" ? " USD" : " сум") + (s.active === a.id ? ", вводится сейчас" : ". Ввести"),
        pick: () => this.setState({ active: a.id, fresh: true })
      })),
      note: any ? "Всего ≈ " + this.fmtInt(total) + " сум, доллары — по курсу ЦБ " + this.fmtInt(rate) + ". Другие счета добавите потом: «Ещё» → «Счета и курс доллара»." : "Не знаете точно — оставьте 0 и поправьте потом: «Ещё» → «Счета и курс доллара». Там же — другие счета.",
      keys: ["1", "2", "3", "4", "5", "6", "7", "8", "9", keyCur === "USD" ? "," : "000", "0", "back"].map((k) => ({ label: k, aria: k === "back" ? "Стереть" : (k === "000" ? "Три нуля" : (k === "," ? "Запятая" : k)), isBack: k === "back", isText: k !== "back", size: k === "000" ? "17px" : "23px", press: () => this.press(k) })),
      // С клавиатуры компьютера (Telegram Desktop) — те же цифры, ⌫ и запятая.
      onKey: (e) => {
        if (!e || !e.key) return;
        const k = /^[0-9]$/.test(e.key) ? e.key : (e.key === "Backspace" ? "back" : (e.key === "," || e.key === "." ? "," : null));
        if (!k) return;
        if (e.preventDefault) e.preventDefault();
        this.press(k);
      },
      btnLabel: any ? "Начать" : "Начать с нуля",
      finish: () => this.setState({ done: true }),
      done: !!s.done,
      fresh: { cash: this.num(s.vals.cash), card: this.num(s.vals.card), usd: this.num(s.vals.usd) }
    };
  }
}
</script>
</body>
</html>
