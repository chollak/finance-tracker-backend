<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Daftar — загрузка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
@keyframes skPulse{0%,100%{opacity:1}50%{opacity:0.55}}
.sk{animation:skPulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div aria-busy="true" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 8px 16px 0; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;">
<p role="status" style="position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;">{{statusText}}</p>
<header style="flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px;">
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M7 0h10a7 7 0 0 1 7 7v10a7 7 0 0 1-7 7H7a7 7 0 0 1-7-7V7a7 7 0 0 1 7-7ZM6 7v2h12V7H6Zm0 4v2h8v-2H6Zm0 4v2h10v-2H6Z"></path></svg>
<span style="font-size: 23px; line-height: 1; font-weight: 800; letter-spacing: -0.7px;">daftar</span>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 8px;"><span class="sk" style="width: 124px; height: 48px; border-radius: 9999px; background: {{t.track}};"></span><span class="sk" style="width: 48px; height: 48px; border-radius: 9999px; background: {{t.track}};"></span></div>
</header>
<section aria-hidden="true" style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 22px; border-radius: 28px; background: {{t.hero}};">
<span class="sk" style="width: 120px; height: 14px; border-radius: 9999px; background: {{t.heroSk}};"></span>
<span class="sk" style="width: 220px; height: 44px; border-radius: 14px; background: {{t.heroSk}};"></span>
<span class="sk" style="width: 100%; height: 8px; border-radius: 9999px; background: {{t.heroSk}};"></span>
<span class="sk" style="width: 180px; height: 12px; border-radius: 9999px; background: {{t.heroSk}};"></span>
</section>
<div aria-hidden="true" style="flex: 0 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<span class="sk" style="height: 82px; border-radius: 24px; background: {{t.track}};"></span>
<span class="sk" style="height: 82px; border-radius: 24px; background: {{t.track}};"></span>
</div>
<div aria-hidden="true" style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; padding-top: 4px;">
<span class="sk" style="width: 200px; height: 20px; border-radius: 9999px; background: {{t.track}};"></span>
<div style="display: flex; flex-direction: column; padding: 4px 16px; border-radius: 24px; background: {{t.card}};">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="height: 60px; display: flex; align-items: center; gap: 12px;">
<span class="sk" style="flex: 0 0 40px; height: 40px; border-radius: 9999px; background: {{t.track}};"></span>
<span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px;"><span class="sk" style="width: {{r.w1}}; height: 12px; border-radius: 9999px; background: {{t.track}};"></span><span class="sk" style="width: {{r.w2}}; height: 10px; border-radius: 9999px; background: {{t.track}};"></span></span>
<span class="sk" style="flex: 0 0 72px; height: 12px; border-radius: 9999px; background: {{t.track}};"></span>
</div>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px; background: {{t.bg}}; overflow: hidden;">
<p style="margin: 0 4px; text-align: center; font-size: 13px; line-height: 1.45; font-weight: 600; color: {{t.muted}};">{{footText}}</p>
<sc-if value="{{slow}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{retry}}" style="height: 56px; border: 0; border-radius: 9999px; background: {{t.primaryBg}}; color: {{t.primaryInk}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;">Попробовать снова</button>
<a href="{{offlineHref}}" style="height: 44px; align-self: center; display: flex; align-items: center; padding: 0 16px; color: {{t.ink}}; font-size: 14px; font-weight: 800;">Записывать без связи</a>
</sc-if>
<sc-if value="{{notSlow}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="display: flex; gap: 8px;"><span class="sk" style="width: 104px; height: 44px; border-radius: 9999px; background: {{t.track}};"></span><span class="sk" style="width: 104px; height: 44px; border-radius: 9999px; background: {{t.track}};"></span><span class="sk" style="width: 104px; height: 44px; border-radius: 9999px; background: {{t.track}};"></span></div>
<div aria-hidden="true" style="display: flex; gap: 8px;"><span class="sk" style="flex: 1 1 auto; height: 56px; border-radius: 9999px; background: {{t.card}};"></span><span class="sk" style="flex: 0 0 56px; height: 56px; border-radius: 9999px; background: {{t.track}};"></span></div>
</sc-if>
</div>
<sc-if value="{{loaded}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 40;">
<dc-import name="Pastel_Home" dark="{{dark}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"slow":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme() {
    if (this.props.dark) return { bg: "#111214", card: "#1b1c1f", ink: "#f4f4f6", muted: "#9d9da6", track: "#26272b", hero: "#f4f4f6", heroSk: "#d4d4db", primaryBg: "#f4f4f6", primaryInk: "#141416" };
    return { bg: "#f3f3f5", card: "#ffffff", ink: "#141416", muted: "#6b6b74", track: "#e7e7ec", hero: "#141416", heroSk: "#3a3b40", primaryBg: "#141416", primaryInk: "#ffffff" };
  }
  componentWillUnmount() { clearTimeout(this._slow); }
  renderVals() {
    // Через 6 секунд без данных честно говорим, что долго, и что записи не потеряются.
    if (!this._armed && !this.props.slow) { this._armed = true; this._slow = setTimeout(() => this.setState({ slow: true }), 6000); }
    const slow = this.state && this.state.slow !== undefined ? this.state.slow : !!this.props.slow;
    return {
      t: this.theme(),
      statusText: slow ? "Загрузка идёт дольше обычного. Проверьте связь — записи не потеряются." : "Загружаю ваши счета и записи",
      footText: slow ? "Дольше обычного — похоже, слабая связь. Записи не пропадут: они хранятся на сервере." : "Загружаю ваши счета и записи…",
      slow: slow,
      notSlow: !slow,
      dark: !!this.props.dark,
      loaded: !!(this.state && this.state.loaded),
      // В прототипе повтор «удаётся» через 1,5 секунды и открывает главную.
      retry: () => { clearTimeout(this._slow); this.setState({ slow: false }); this._slow = setTimeout(() => this.setState({ loaded: true }), 1500); },
      offlineHref: this.props.dark ? "Pastel_HomeOfflineDark.dc.html" : "Pastel_HomeOffline.dc.html",
      rows: [{ w1: "55%", w2: "35%" }, { w1: "45%", w2: "50%" }, { w1: "60%", w2: "30%" }].concat(slow ? [] : [{ w1: "40%", w2: "45%" }])
    };
  }
}
</script>
</body>
</html>
